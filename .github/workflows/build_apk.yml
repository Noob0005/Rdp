name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.0'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Reconstruct Android Project
        run: |
          echo "Moving source code to temp..."
          mv expense_flutter source_temp
          
          echo "Generating platform files..."
          flutter create --project-name expense_flutter --org com.settler expense_flutter
          
          echo "Restoring logic..."
          rm -rf expense_flutter/lib
          cp -r source_temp/lib expense_flutter/
          cp source_temp/pubspec.yaml expense_flutter/
          
          # Ensure dependencies in pubspec match the generated project structure if needed
          # (Our pubspec is standard, so copying it back is safe)
          
          echo "Cleanup..."
          rm -rf source_temp

      - name: Get Dependencies
        working-directory: ./expense_flutter
        run: flutter pub get

      - name: Build APK
        working-directory: ./expense_flutter
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: expense_flutter/build/app/outputs/flutter-apk/app-release.apk