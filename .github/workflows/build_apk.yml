name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.0'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Reconstruct Android Project
        run: |
          echo "Moving source code to temp..."
          mv expense_flutter source_temp
          
          echo "Generating platform files..."
          flutter create --project-name expense_flutter --org com.settler expense_flutter
          
          echo "Restoring logic..."
          rm -rf expense_flutter/lib
          cp -r source_temp/lib expense_flutter/
          cp source_temp/pubspec.yaml expense_flutter/
          
          echo "Cleanup..."
          rm -rf source_temp

      - name: Patch Android SDK Versions
        working-directory: ./expense_flutter/android/app
        run: |
          echo "Patching build.gradle to support modern plugins..."
          # Force minSdkVersion to 23 (required by many file/permission plugins)
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' build.gradle
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 23/g' build.gradle
          
          # Force compileSdkVersion to 34 (Android 14)
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' build.gradle
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' build.gradle
          
          # Force targetSdkVersion to 34
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' build.gradle
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/g' build.gradle

      - name: Get Dependencies
        working-directory: ./expense_flutter
        run: flutter pub get

      - name: Build APK
        working-directory: ./expense_flutter
        run: flutter build apk --release --no-tree-shake-icons --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: expense_flutter/build/app/outputs/flutter-apk/app-release.apk